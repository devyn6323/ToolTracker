spring.profiles.active=test
spring.datasource.url=jdbc:h2:mem:tooltrack;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
app.jwt.secret=test-secret-that-is-long-enough-for-hmac-sha256-signing
app.jwt.expiration=86400000
app.upload.dir=${java.io.tmpdir}/tooltrack-test-uploads
app.support.email=support@test.invalid
