spring.application.name=tooltrack-backend
spring.profiles.default=dev
server.port=${PORT:8080}
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true

app.jwt.secret=${JWT_SECRET:replace-this-development-secret-with-at-least-32-bytes}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.upload.dir=${UPLOAD_DIR:uploads}
app.photo.storage=${PHOTO_STORAGE:local}
app.cloudinary.url=${CLOUDINARY_URL:}
app.google.web-client-id=${GOOGLE_WEB_CLIENT_ID:}
app.mail.from=${MAIL_FROM:${SUPPORT_EMAIL:}}
app.mail.required=${MAIL_REQUIRED:false}

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
server.forward-headers-strategy=framework
server.error.include-message=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
app.support.email=${SUPPORT_EMAIL:support@example.invalid}
