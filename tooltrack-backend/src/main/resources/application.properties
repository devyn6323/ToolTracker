spring.application.name=tooltrack-backend
spring.profiles.default=dev
server.port=${PORT:8080}
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true

app.jwt.secret=${JWT_SECRET:replace-this-development-secret-with-at-least-32-bytes}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.upload.dir=${UPLOAD_DIR:uploads}
app.photo.storage=${PHOTO_STORAGE:local}
app.cloudinary.url=${CLOUDINARY_URL:}
app.google.web-client-id=${GOOGLE_WEB_CLIENT_ID:}
app.mail.from=${MAIL_FROM:${SUPPORT_EMAIL:}}
app.mail.from-name=${MAIL_FROM_NAME:ToolTrack}
app.mail.required=${MAIL_REQUIRED:false}
app.brevo.api-key=${BREVO_API_KEY:}
app.brevo.base-url=${BREVO_BASE_URL:https://api.brevo.com}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
server.forward-headers-strategy=framework
server.error.include-message=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
app.support.email=${SUPPORT_EMAIL:support@example.invalid}
