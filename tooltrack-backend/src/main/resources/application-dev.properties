# Local development runs without requiring PostgreSQL credentials. Data persists under ./data.
spring.datasource.url=jdbc:h2:file:./data/tooltrack-dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
