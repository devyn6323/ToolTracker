services:
  - type: web
    name: tooltrack-api
    runtime: docker
    plan: free
    dockerfilePath: ./tooltrack-backend/Dockerfile
    dockerContext: ./tooltrack-backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: tooltrack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SUPPORT_EMAIL
        sync: false
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: PHOTO_STORAGE
        value: cloudinary
      - key: CLOUDINARY_URL
        sync: false
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false

databases:
  - name: tooltrack-db
    plan: free
    databaseName: tooltrack
    user: tooltrack
